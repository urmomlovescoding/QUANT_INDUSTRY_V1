# QUANT_INDUSTRY_V1 - Docker Compose Configuration
# Supports: development, testing, production

version: '3.9'

services:
  # ===========================================
  # Main Application
  # ===========================================
  app:
    build:
      context: .
      target: runtime
    container_name: quant-api
    ports:
      - "8000:8000"
      - "8001:8001"  # WebSocket
    environment:
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://quant:${DB_PASSWORD:?DB_PASSWORD environment variable must be set}@postgres:5432/quantdb
      - REDIS_URL=redis://redis:6379/0
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - quant-network

  # ===========================================
  # Worker Service (Background Tasks)
  # ===========================================
  worker:
    build:
      context: .
      target: runtime
    container_name: quant-worker
    command: ["python", "-m", "celery", "-A", "core.tasks", "worker", "--loglevel=info"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql://quant:${DB_PASSWORD:?DB_PASSWORD environment variable must be set}@postgres:5432/quantdb
      - REDIS_URL=redis://redis:6379/0
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - app
      - redis
    restart: unless-stopped
    networks:
      - quant-network

  # ===========================================
  # Scheduler Service (Cron Jobs)
  # ===========================================
  scheduler:
    build:
      context: .
      target: runtime
    container_name: quant-scheduler
    command: ["python", "-m", "celery", "-A", "core.tasks", "beat", "--loglevel=info"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - worker
    restart: unless-stopped
    networks:
      - quant-network

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: quant-postgres
    environment:
      - POSTGRES_USER=quant
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD environment variable must be set}
      - POSTGRES_DB=quantdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quantdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - quant-network

  # ===========================================
  # Redis Cache & Message Broker
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: quant-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - quant-network

  # ===========================================
  # TimescaleDB (Time-Series Data)
  # ===========================================
  timescale:
    image: timescale/timescaledb:latest-pg15
    container_name: quant-timescale
    environment:
      - POSTGRES_USER=quant
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD environment variable must be set}
      - POSTGRES_DB=marketdata
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d marketdata"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - quant-network

  # ===========================================
  # Prometheus Monitoring
  # ===========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: quant-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - quant-network

  # ===========================================
  # Grafana Dashboards
  # ===========================================
  grafana:
    image: grafana/grafana:latest
    container_name: quant-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD environment variable must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - quant-network

  # ===========================================
  # Nginx Reverse Proxy (Production)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: quant-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - quant-network
    profiles:
      - production

# ===========================================
# Networks
# ===========================================
networks:
  quant-network:
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
  redis_data:
  timescale_data:
  prometheus_data:
  grafana_data:
