name: CI - Quant Industry Supremacy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Gate 3: Parity Tests
  parity-tests:
    name: Parity Tests (Gate 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r backend/requirements.txt || true

      - name: Run Parity Tests
        run: |
          cd backend
          python -m pytest ../tests/parity/ -v --tb=short
        env:
          APP_MODE: platform_compat

  # Gate 4: Static Quality
  static-quality:
    name: Static Quality (Gate 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff
        run: |
          ruff check backend/ --exclude "backend/venv" --output-format=github
        continue-on-error: true

      - name: Run Ruff (Statistics)
        run: |
          ruff check backend/ --exclude "backend/venv" --statistics || true

      - name: Run Mypy
        run: |
          mypy backend/ --exclude "backend/venv" --ignore-missing-imports || true
        continue-on-error: true

  # Gate 5: Unit Tests
  unit-tests:
    name: Unit Tests (Gate 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -r backend/requirements.txt || true

      - name: Run Unit Tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short -x
        env:
          ALPACA_API_KEY: test_key
          TRADIER_API_KEY: test_key

      - name: Test Coverage Report
        run: |
          cd backend
          python -m pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=50 || true

  # Combined Report
  quality-report:
    name: Quality Report
    runs-on: ubuntu-latest
    needs: [parity-tests, static-quality, unit-tests]
    if: always()
    steps:
      - name: Quality Summary
        run: |
          echo "## Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gate 3 (Parity) | ${{ needs.parity-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate 4 (Static) | ${{ needs.static-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate 5 (Tests) | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check Critical Gates
        if: needs.parity-tests.result == 'failure'
        run: |
          echo "::error::Gate 3 (Parity Tests) FAILED - Behavioral parity violated"
          exit 1
